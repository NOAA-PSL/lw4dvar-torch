exp:
  model_backend: aifs   # aifs3 env -> aifs3_model.AIFS3Model (run_aifs3.sh)

  nhrs_back: 48
  restart: False
  rpath: './output/<previous_exp_name>/'
  obspath: '/scratch3/NCEPDEV/da/Jeffrey.Whitaker/psobs'
  nobs_max: 15000
  ic_suffix: '120h_50it'
  sdate: '2015-01-01T00'
  n_init: 1
  dt_init: 6
  save_levs: [1000,850,500,250,50]
  cycle: False
  exp_name: 'test_aifs3_1deg_ic1_5d_6h_50it'

  # user-trained 1-degree (O96) checkpoint, one input time level (S. Frolov)
  model_name: 'inference-last.ckpt'
  path_model: '/scratch4/BMC/gsienkf/Sergey.Frolov/eagle/latent/EAGLE/run/aifs2-1deg-ic1/training/outputs/checkpoint/8a8641f4213949afb3c68365ea7d1e63/'
  aifs_config: 'backends/aifs/aifs_inference_aifs2-1deg-ic1.yaml'
  device: 'cuda'
  path_output: './output/'
  # O96 ERA5 cache warmed for the aifs2-1.0deg-v1.0 checkpoint (same grid and
  # input variables -- checked by backends/aifs/probe_aifs3_validate.py)
  ic_cache: '/scratch4/BMC/gsienkf/Bo.Huang/expCodes/ML/lw4dvar-torch-dev/ic_cache/ic_cache_aifs2-1.0deg-v1.0/'
  print_every: 10
  oberrstart: -1
  oberrdeltaperday: 0
  control_variables: [u, v, t, z, q, sp, msl, 2t, 2d, 10u, 10v, tcw]
  checkpoint_stride: 0
  reset_skt_ocean: True
  skt_ocean_lsm_threshold: 0.5

windows:
  '5':
    n_verif: 20
    dt_verif: 6
    dt_obs: 6
    learn_rate: 2.0e-3   # untuned for this checkpoint
    weight_decay: 1.0e-3
    max_epoch: 50
    warmup_steps: 10
    start_factor: 0.1
    end_factor: 0.625
    bg_check: 4.
    zthresh: 500.
    zconst: 0.003
    suffix: ''
