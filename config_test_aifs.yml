exp:
  model_backend: aifs

  nhrs_back: 48
  restart: False
  rpath: './output/<previous_exp_name>/'
  obspath: '/scratch3/NCEPDEV/da/Jeffrey.Whitaker/psobs'
  nobs_max: 15000
  ic_suffix: '120h_100it'
  sdate: '2015-01-01T00'
  n_init: 1
  dt_init: 12
  save_levs: [1000,850,500,250,50]
  cycle: False
  exp_name: 'test_aifs_5d_12h_100it'

  model_name: 'aifs-single-mse-2.0.ckpt'
  path_model: './backends/aifs/aifs-single-2.0/'
  aifs_config: 'backends/aifs/aifs_inference.yaml'
  device: 'cuda'
  path_output: './output/'
  # reuse the original aifsv2 repo's already-warmed ERA5 cache -- avoids
  # needing internet from this (offline) H100 compute node for a smoke test
  ic_cache: '/scratch4/BMC/gsienkf/Jeffrey.Whitaker/long-window-4dvar-aifsv2/ic_cache/'
  print_every: 10
  oberrstart: -1
  oberrdeltaperday: 0
  control_variables: [u, v, t, z, q, sp, msl, 2t, 2d, 10u, 10v, tcw]
  checkpoint_stride: 0
  reset_skt_ocean: True
  skt_ocean_lsm_threshold: 0.5

windows:
  '5':
    n_verif: 20
    dt_verif: 6
    dt_obs: 6
    learn_rate: 2.0e-3
    weight_decay: 1.0e-3
    max_epoch: 100
    warmup_steps: 10
    start_factor: 0.1
    end_factor: 0.1
    bg_check: 4.
    zthresh: 500.
    zconst: 0.003
    suffix: ''
