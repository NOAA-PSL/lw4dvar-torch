name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No submodules and no LFS: the model packages are large LFS repos
      # (ACE2-ERA5 alone is ~75 GB) and the CPU tests never load them.
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: make check
