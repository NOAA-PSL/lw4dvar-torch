exp:
  model_backend: sfno

  nhrs_back: 48
  restart: False
  rpath: './output/<previous_exp_name>/'
  obspath: '/scratch3/NCEPDEV/da/Jeffrey.Whitaker/psobs'
  nobs_max: 15000
  ic_suffix: '12h_5it'
  sdate: '2015-01-01T00'
  n_init: 1
  dt_init: 12
  save_levs: [1000, 850, 500, 250, 50]
  cycle: False
  exp_name: 'smoke_test_sfno_ps'

  # converted NGC package (backends/sfno/sfno_prefetch_checkpoint.py)
  path_model: './backends/sfno/ngc_cache/sfno_73ch_small/'
  device: 'cuda'
  ps_operator: 'ps'
  path_output: './output/'
  # SFNO reuses FCN3's ERA5 cache + per-date 'sp' files (backends/sfno/sfno_ic.py)
  ic_cache: '/scratch4/BMC/gsienkf/Jeffrey.Whitaker/long-window-4dvar-fcstnetv3/ic_cache/'
  print_every: 1
  oberrstart: 1.0
  oberrdeltaperday: 0.25

windows:
  '1':
    n_verif: 2
    dt_verif: 6
    learn_rate: 2.5e-3
    weight_decay: 1.0e-3
    max_epoch: 5
    warmup_steps: 1
    start_factor: 0.5
    end_factor: 0.5
    bg_check: 4.
    zthresh: 500.
    zconst: 0.003
    suffix: ''
