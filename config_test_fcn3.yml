exp:
  model_backend: fcn3

  nhrs_back: 24
  restart: False
  rpath: './output/<previous_exp_name>/'
  obspath: '/scratch3/NCEPDEV/da/Jeffrey.Whitaker/psobs'
  nobs_max: 15000
  ic_suffix: '12h_5it'
  sdate: '2015-01-01T00'
  n_init: 1
  dt_init: 12
  save_levs: [500]
  cycle: False
  exp_name: 'smoke_test_fcn3'

  path_model: './backends/fcn3/fourcastnet3/'
  device: 'cuda'
  path_output: './output/'
  # reuse the original fcstnetv3 repo's already-warmed ERA5 cache -- avoids
  # needing internet from this (offline) H100 compute node for a smoke test
  ic_cache: '/scratch4/BMC/gsienkf/Jeffrey.Whitaker/long-window-4dvar-fcstnetv3/ic_cache/'
  print_every: 1
  oberrstart: 1.0
  oberrdeltaperday: 0.25

windows:
  '1':
    n_verif: 2
    dt_verif: 6
    learn_rate: 1.0e-2
    weight_decay: 1.0e-3
    max_epoch: 5
    warmup_steps: 1
    start_factor: 0.5
    end_factor: 0.5
    bg_check: 4.
    zthresh: 500.
    zconst: 0.003
    suffix: ''
