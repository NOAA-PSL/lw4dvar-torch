exp:
  model_backend: aifs   # anemoi-dev env -> aifs3_model.AIFS3Model (run_aifs-r2-t1.sh)

  nhrs_back: 48
  restart: False
  rpath: './output/<previous_exp_name>/'
  observations:
    psobs:
      path: '/scratch4/BMC/gsienkf/Bo.Huang/expCodes/ML/lw4dvar-torch-dev/prepbufr_to_parquet/data/prepbufr_parquet'
      nobs_max: 15000
      use_source_error: True # preserve the legacy .txt reader's per-ob error (parquet pressure_error_mb)
  ic_suffix: '120h_50it'
  sdate: '2015-01-01T00'
  n_init: 1
  dt_init: 6
  save_levs: [1000,850,500,250,50]
  cycle: False
  exp_name: 'test_aifs_r2_t1_5d_6h_50it'

  # S. Frolov's AIFS-r2-t1 checkpoint (multi-dataset anemoi API, 2 input
  # time levels, 207 variables, O96 grid -- see docs/integrate_multiple_backends.md)
  model_name: 'inference-last.ckpt'
  path_model: '/scratch4/BMC/gsienkf/Sergey.Frolov/eagle/long-window/EAGLE/run/aifs-r2-t1/training/outputs/checkpoint/fa3cac00bd764adf83ec79e518456601/'
  aifs_config: 'backends/aifs/aifs_inference_aifs-r2-t1.yaml'
  device: 'cuda'
  path_output: './output/'
  # Reads straight from the shared training-data zarr join
  # (backends/aifs/aifs_zarr_ic.py) instead of ERA5 GRIB -- no ic_cache or
  # login-node prefetch needed for this checkpoint.
  aifs_ic_module: 'aifs_zarr_ic'
  print_every: 10
  oberrstart: -1
  oberrdeltaperday: 0
  control_variables: [u, v, t, z, q, sp, msl, 2t, 2d, 10u, 10v, tcw]
  checkpoint_stride: 0
  reset_skt_ocean: True
  skt_ocean_lsm_threshold: 0.5

windows:
  '5':
    n_verif: 20
    dt_verif: 6
    dt_obs: 6
    learn_rate: 2.0e-3   # untuned for this checkpoint; carried over from aifs2-1deg-ic1 (same hidden-mesh size)
    weight_decay: 1.0e-3
    max_epoch: 50
    warmup_steps: 10
    start_factor: 0.1
    end_factor: 0.625
    bg_check: 4.
    zthresh: 500.
    zconst: 0.003
    suffix: ''
