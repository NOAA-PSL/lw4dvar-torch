exp:
  model_backend: ngcm

  nhrs_back: 48
  restart: False
  rpath: './output/test_ngcm_6h_5d_50it/'
  obspath: '/scratch3/NCEPDEV/da/Jeffrey.Whitaker/psobs'
  nobs_max: 15000
  ic_suffix: '120h_50it'
  sdate: '2015-01-01T00'
  n_init: 1
  dt_init: 6
  save_levs: [1000, 850, 500, 250, 50]
  cycle: False
  exp_name: 'test_ngcm_6h_5d_50it'

  # JAX model (backends/ngcm, run with run_ngcm.sh): an ngcm-train run dir,
  # checkpoint step, and its data store (ICs and verification read locally).
  ngcm_exp: '/scratch4/BMC/gsienkf/whitaker/ngcm_runs/r72_top150'
  ngcm_step: 51660
  ngcm_data: '/scratch4/BMC/gsienkf/whitaker/ngcm_data/era5_ace2l32_tl63'
  ngcm_train_path: '/scratch4/BMC/gsienkf/whitaker/python/ngcm-train'
  device: 'cuda'
  path_output: './output/'
  ic_cache: './ic_cache_ngcm/'
  print_every: 10
  oberrstart: -1
  oberrdeltaperday: 0
  # ps_operator defaults to 'ps_native' for NGCM (32 hybrid layers)
  # control_variables (packed modal/nodal state families): vorticity,
  # divergence, air_temperature, log_surface_pressure,
  # hybrid_specific_humidity, specific_total_condensate (default: all)
  jc_ps_weight: 32

windows:
  '5':
    n_verif: 20
    dt_verif: 6
    dt_obs: 6
    learn_rate: 1.0e-3
    weight_decay: 1.0e-3
    max_epoch: 50
    warmup_steps: 10
    start_factor: 0.1
    end_factor: 1
    bg_check: 4.
    zthresh: 500.
    zconst: 0.003
    suffix: ''
