# Secondary pressure-level decoder (as ACE2.1-ERA5's) trained onto the finished
# 16-layer CRTM+land checkpoint (ace2-crtm-land-16layer-1979-2025-no2015,
# best_ckpt.tar = epoch-120 EMA weights, the ones lw4dvar runs). Generated from
# ace2-crtm-16layer-train-config-ursa.yaml as ace2-era5-vars-pldecoder-train-config-ursa.yaml
# was from the 8-layer config (commit 0295ca3): main SFNO loaded and fully frozen
# (parameter_init module 0), only the new column-local MLP decoder (module 1) is
# trained; fme feeds it the main output .detach()ed, so this equals joint training.
# Decoder outputs: h/TMP/Q/UGRD/VGRD at 1000..50 hPa (ACE2.1's 13 levels) + 10 hPa,
# minus h500 and TMP850 (main outputs): 68 fields, all in the 16-layer
# dataset and its stats. Decoder and optimization as ACE2.1-ERA5's fine-tune config (MLP depth 2,
# AdamW lr 1e-4, wd 0.01, LinearLR 0.01->1 over 5 epochs = 21000 batches, then
# constant, 120 epochs), plus the 10 hPa level. ACE2.1 also decodes TMP2m/Q2m/
# UGRD10m/VGRD10m; here they are main outputs, like h500 and TMP850.
# Plus h500_dec / TMP850_dec: copies of the main outputs h500 / TMP850 (sidecar
# ace2_era5_1deg_16layer/dec-alias, stats ...-decalias = the land stats + the
# aliases; backends/ace2/training/alias_sidecar.py), so the decoder's h500 / T850
# can be scored against the jointly trained main-network ones (70 fields).
# Train loader 16 workers x prefetch 2, as the 16-layer run used on u1-mi300x.
# Launch through fme_train.py (slurm/run_ace2_train_ursa.sh / slurm/run_ace2_train_mi300x.sh)
# with CONFIG=<this file>.
experiment_dir: /scratch4/BMC/gsienkf/whitaker/ace2_training/ace2-crtm-land-16layer-1979-2025-no2015-pldecoder
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
seed: 1
ema:
  decay: 0.999
inference:
  n_forward_steps: 1440
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '2015-01-01T00:00:00'
      - '2015-01-01T06:00:00'
      - '2015-01-01T12:00:00'
      - '2015-01-01T18:00:00'
      - '2015-01-02T00:00:00'
      - '2015-01-02T06:00:00'
      - '2015-01-02T12:00:00'
      - '2015-01-02T18:00:00'
      - '2015-01-03T00:00:00'
