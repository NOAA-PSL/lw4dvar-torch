      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/snow-capped-1000
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/dec-alias
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    num_data_workers: 8
  aggregator:
    log_histograms: true
    time_mean_reference_data: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/stats-1990-01-2019-12-condensate-floor-land-decalias/time-mean.nc
