# ACE2 with 16 layers, CRTM layer variables and land surface (ace2-training.md,
# "CRTM layer variables" and "Training: 16 layers, CRTM + land"): vapor
# (specific_humidity), total condensate (specific_total_condensate) and ozone
# (ozone_mass_mixing_ratio) replace specific_total_water as prognostics.
# Everything else as ace2-era5-vars-train-config.yaml (generated from it):
# same architecture, forcings, diagnostics, training settings and corrector.
# - Total water for the dry-air and moisture-budget correctors is vapor +
#   condensate, supplied by fme_train.py (fme only knows the
#   specific_total_water_ prefix). Run through fme_train.py, not fme.ace.train.
# - Layers nested in the 8-layer grid (L137 interfaces 0 24 48 58 67 73 79
#   84 90 95 100 104 109 114 119 128 137): 8-layer layer k = 16-layer 2k,
#   2k+1. Loss weights: fme applies them to the fields before the MSE, so a
#   channel's loss share goes as w^2; each half gets ACE2-ERA5's 8-layer
#   weight / sqrt(2) (default 1 -> 0.707), keeping every family's 8-layer
#   share. Vapor and condensate (same weights): layers 0-3 (top-144 hPa,
#   layer 3 mean ~117 hPa) 0.1 (w^2 1/50 of the layers below 252 hPa); 4-5
#   0.354 (ACE2-ERA5's 0.5 for that total-water layer);
#   6-15 0.707. Ozone (stratosphere-dominated): layers 0-5 (top-252 hPa)
#   0.707, 6-7 (252-401 hPa, transition) 0.354, 8-15 (below ~401 hPa,
#   troposphere) 0.1 (w^2 1/50 of the layers above).
# - Normalization: ace2_era5_1deg_16layer/stats-1990-01-2019-12-condensate-
#   floor-land (condensate std floored at 1e-6 kg/kg in layers 0-2, plus the
#   capped snow's stats; see ace2-training.md).
# - Train 1979-2014 + 2016-2025; 2015 held out (validation, inline inference).
# - 112 input / 118 output channels (108 / 114 without land); by the memory
#   probe, fits 1 sample/GPU on 4 Polaris nodes without checkpointing, at the
#   same speed as 8 layers.
#   Inline inference: forward_steps_in_memory 20 (40 ran out of memory in
#   fme's total-energy diagnostic, smoke test 2026-10-28).
# Land surface, for satellite surface emissivity: four more prognostics,
# soil_moisture_0 (ERA5 swvl1, 0-7 cm, m3/m3), soil_temperature_0 (stl1,
# 0-7 cm, K), surface_snow_amount_capped (snow water equivalent, kg/m2,
# capped at 1000) and surface_snow_area_fraction.
# - Snow is capped because ERA5 pins it at 1e4 kg/m2 on the ice sheets and
#   has thousands in partly glaciated cells, which set the normalization
#   (std ~1700 vs a 41 kg/m2 median of snowy cells); emissivity doesn't see
#   past ~1 m water equivalent. The capped field lives in a sidecar dataset
#   (ace2_dataset.py capped_snow -> ace2_era5_1deg_16layer/snow-capped-1000),
#   merged with the main files in every loader; the training files are
#   untouched.
# - Over ocean soil moisture and snow are 0 and soil temperature is ~SST.
#   Soil moisture and both snow fields are force_positive; snow fraction is
#   not capped at 1 by fme (clip downstream).
# - Loss weights of the four: 1 (default, untuned; ~2% of the loss).
# - Deep soil layers left out (only the top layer matters for emissivity);
#   the model must carry soil memory in its own state.
experiment_dir: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_training/ace2-crtm-land-16layer-1979-2025-no2015
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
seed: 0
ema:
  decay: 0.999
inference:
  n_forward_steps: 1440
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '2015-01-01T00:00:00'
      - '2015-01-01T06:00:00'
      - '2015-01-01T12:00:00'
      - '2015-01-01T18:00:00'
      - '2015-01-02T00:00:00'
      - '2015-01-02T06:00:00'
      - '2015-01-02T12:00:00'
      - '2015-01-02T18:00:00'
