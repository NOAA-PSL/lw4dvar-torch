  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 16
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    merge:
    - concat:
      - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_16layer
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '1979-01-01T00:00:00'
          stop_time: '2014-12-31T06:00:00'
