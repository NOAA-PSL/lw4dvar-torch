  batch_size: 128
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    merge:
    - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_16layer
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      subset:
        start_time: '2015-01-01T00:00:00'
        stop_time: '2015-12-31T06:00:00'
        step: 3
    - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_16layer/snow-capped-1000
