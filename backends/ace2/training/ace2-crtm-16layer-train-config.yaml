        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '2016-01-01T00:00:00'
          stop_time: '2025-12-31T06:00:00'
    - concat:
      - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_16layer/snow-capped-1000
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '1979-01-01T00:00:00'
          stop_time: '2014-12-31T06:00:00'
      - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_16layer/snow-capped-1000
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '2016-01-01T00:00:00'
          stop_time: '2025-12-31T06:00:00'
