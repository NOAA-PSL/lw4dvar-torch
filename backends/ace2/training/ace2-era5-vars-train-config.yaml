# ACE2 trained from scratch on our ARCO-ERA5 dataset (ace2-training.md).
# Stepper = the ACE2-ERA5 checkpoint's (architecture, in/out names incl.
# global_mean_co2 and the TMP2m/Q2m/UGRD10m/VGRD10m/TMP850/h500 channels, loss
# weights, corrector), so results compare directly with ACE2-ERA5 in lw4dvar.
# Training settings from ACE2.1-ERA5 (../ACE2.1-ERA5-AIMIP/configs/
# ace-train-config.yaml). Train 1979-2014 + 2016-2022; 2015 held out for
# validation and inline inference (4 ICs, one per GPU rank as fme requires,
# 1 day apart; 1440 steps from the last still ends inside 2015). Subsets
# select sample START times; stops at T06 keep each 3-time sample
# (n_forward_steps=2) inside its year range.
# checkpointing: 3 (gradient checkpointing of every SFNO block; same math, more
# compute) is needed to fit 4 samples/GPU on Polaris' 40 GB A100s.
# fme (ace2 env, 2026.5.1): torchrun --nproc_per_node 4 -m fme.ace.train THIS.yaml
experiment_dir: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_training/ace2-era5-vars-1979-2022-no2015
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
seed: 0
ema:
  decay: 0.999
inference:
  n_forward_steps: 1440
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '2015-01-01T00:00:00'
      - '2015-01-02T00:00:00'
      - '2015-01-03T00:00:00'
      - '2015-01-04T00:00:00'
    dataset:
      data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    num_data_workers: 8
  aggregator:
    log_histograms: true
    time_mean_reference_data: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer/stats-1990-01-2019-12/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 16
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    concat:
    - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      subset:
        start_time: '1979-01-01T00:00:00'
        stop_time: '2014-12-31T06:00:00'
    - data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      subset:
        start_time: '2016-01-01T00:00:00'
        stop_time: '2022-12-31T06:00:00'
validation_loader:
  batch_size: 128
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    data_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer
    file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    subset:
      start_time: '2015-01-01T00:00:00'
      stop_time: '2015-12-31T06:00:00'
      step: 3
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 2
  loss:
    type: MSE
    weights:
      DLWRFsfc: 2
      DSWRFsfc: 2
      PRATEsfc: 0.5
      Q2m: 0.5
      TMP850: 5
      ULWRFsfc: 5
      USWRFsfc: 2
      USWRFtoa: 2
      air_temperature_0: 0.5
      air_temperature_1: 0.5
      eastward_wind_0: 0.5
      h500: 10
      northward_wind_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      tendency_of_total_water_path_due_to_advection: 0.5
stepper:
  step:
    type: single_module
    config:
      builder:
        type: SphericalFourierNeuralOperatorNet
        config:
          embed_dim: 384
          filter_type: linear
          hard_thresholding_fraction: 1.0
          normalization_layer: instance_norm
          num_layers: 8
          operator_type: dhconv
          pos_embed: true
          scale_factor: 1
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          use_mlp: true
          checkpointing: 3
      normalization:
        network:
          global_means_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer/stats-1990-01-2019-12/centering.nc
          global_stds_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer/stats-1990-01-2019-12/scaling-full-field.nc
        residual:
          global_means_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer/stats-1990-01-2019-12/centering.nc
          global_stds_path: /lus/eagle/projects/moonshot-reanalysis/jwhitaker/ace2_era5_1deg_8layer/stats-1990-01-2019-12/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - global_mean_co2
      - PRESsfc
      - surface_temperature
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
      - eastward_wind_7
      - northward_wind_0
      - northward_wind_1
      - northward_wind_2
      - northward_wind_3
      - northward_wind_4
      - northward_wind_5
      - northward_wind_6
      - northward_wind_7
      out_names:
      - PRESsfc
      - surface_temperature
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
