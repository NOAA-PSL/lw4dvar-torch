# ACE2 at 32 layers (nested split of the 8-layer grid, ace2-training.md "32-layer
# vertical grid") with embed_dim 512, trained from scratch on 1979-2025 of
# /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer; validation and the inline
# inference on 2026-01..03 (built from ARCO 2026-10-20; CO2 extrapolated; ARCO's
# model levels are NaN for all of 2026-04-10, so the April-July build stopped).
# Otherwise ace2-era5-vars-train-config-ursa.yaml (ACE2-ERA5's stepper, ACE2.1
# training settings), generated from it by expanding every layer variable to 32
# layers. Loss weights (option (a)): fme applies them to the fields before the
# MSE, so a channel's loss share goes as w^2; each 8-layer weight (default 1) is
# divided by sqrt(4) = 2 for its 4 sub-layers, so layer variables keep their
# 8-layer share of the loss -- except specific_total_water_0..8 (0.01-167 hPa: smooth, near-constant
# stratospheric water above ~50 hPa and spike-dominated, unphysical 4-8 g/kg maxima
# at 69-167 hPa), all set to 0.01. Inline inference: 320 steps (80 days) from 16 ICs on 2026-01-01..04,
# ending inside the March 2026 data. Validation batch 16 (not 128): fme drops the
# last partial batch, and Jan-Mar at step 3 is only ~119 samples. Launcher: run_ace2_train_ursa.sh with
# CONFIG=backends/ace2/training/ace2-era5-32layer-e512-train-config-ursa.yaml.
experiment_dir: /scratch4/BMC/gsienkf/whitaker/ace2_training/ace2-era5-32layer-e512-1979-2025
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
seed: 0
ema:
  decay: 0.999
inference:
  n_forward_steps: 320
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '2026-01-01T00:00:00'
      - '2026-01-01T06:00:00'
      - '2026-01-01T12:00:00'
      - '2026-01-01T18:00:00'
      - '2026-01-02T00:00:00'
      - '2026-01-02T06:00:00'
      - '2026-01-02T12:00:00'
      - '2026-01-02T18:00:00'
      - '2026-01-03T00:00:00'
      - '2026-01-03T06:00:00'
      - '2026-01-03T12:00:00'
      - '2026-01-03T18:00:00'
      - '2026-01-04T00:00:00'
      - '2026-01-04T06:00:00'
      - '2026-01-04T12:00:00'
      - '2026-01-04T18:00:00'
    dataset:
      data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    num_data_workers: 8
  aggregator:
    log_histograms: true
    time_mean_reference_data: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer/stats-1990-01-2019-12/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 16
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
    file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    subset:
      start_time: '1979-01-01T00:00:00'
      stop_time: '2025-12-31T06:00:00'
validation_loader:
  batch_size: 16
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
    file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    subset:
      start_time: '2026-01-01T00:00:00'
      stop_time: '2026-03-31T06:00:00'
      step: 3
