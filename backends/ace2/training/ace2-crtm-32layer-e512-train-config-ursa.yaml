# ACE2 at 32 layers, embed_dim 512, with the CRTM layer variables and land
# surface: ace2-crtm-16layer-train-config.yaml (ace2-training.md, "Training:
# 16 layers, CRTM + land") expanded to the 32-layer grid with
# ace2-era5-32layer-e512-train-config-ursa.yaml's embed_dim 512. Generated
# (regenerate, don't edit) by expanding every 16-layer variable j to
# 32-layer 2j and 2j+1 -- the 16-layer grid is every other 32-layer
# interface -- with Eagle paths -> /scratch4/BMC/gsienkf/whitaker and
# 16layer -> 32layer data.
# - Loss weights: w16 / sqrt(2) per sub-layer (fme's loss share goes as w^2,
#   so each family keeps its 16-layer and 8-layer share): 0.707 -> 0.5,
#   0.354 -> 0.25, 0.1 -> 0.071. Air temperature/winds come out as in the
#   e512 total-water config (layers 0-7 0.25, rest 0.5). Vapor and
#   condensate: 0-7 (top-144 hPa) 0.071, 8-11 0.25, 12-31 0.5. Ozone: 0-11
#   (top-252 hPa) 0.5, 12-15 (252-401 hPa) 0.25, 16-31 0.071. 2-D weights
#   (incl. surface_snow_amount_capped 0.1) unchanged.
# - Train 1979-2014 + 2016-2025, 2015 held out (validation, 1440-step inline
#   inference from 16 ICs, forward_steps_in_memory 20) as at 16 layers --
#   not the e512 run's 2026 validation: the CRTM families were only built
#   for 1979-2025.
# - 208 input / 214 output channels (e512 total-water run: 140 / 146);
#   untested -- run a smoke test first (memory: the probe found channels
#   cost little; e512 fit on 4 u1-h100 nodes without checkpointing).
# - Train loader 16 workers x prefetch 2 (as at 16 layers); 32-layer
#   samples are about twice as many per-variable reads, so loading may
#   limit speed even more.
# Prerequisites on Ursa (not there yet, 2026-10-30):
# - CRTM families (specific_humidity_, specific_total_condensate_,
#   ozone_mass_mixing_ratio_ 0-31) in ace2_era5_1deg_32layer 1979-2025
#   (Hercules add_layer_families jobs, ace2crtm32_chain*), copied over.
# - ace2_era5_1deg_32layer/stats-1990-01-2019-12-condensate-floor-land: the
#   32-layer stats with those families, condensate std floored at 1e-6
#   kg/kg, plus surface_snow_amount_capped's stats (same field as at 16
#   layers: copy them from the 16-layer -land stats).
# - The capped-snow sidecar is the 16-layer one
#   (ace2_era5_1deg_16layer/snow-capped-1000): a 2-D field with the same
#   times and grid as the 32-layer files (checked 1979-01, 2015-07, 2025-12).
experiment_dir: /scratch4/BMC/gsienkf/whitaker/ace2_training/ace2-crtm-land-32layer-e512-1979-2025-no2015
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
seed: 0
ema:
  decay: 0.999
inference:
  n_forward_steps: 1440
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '2015-01-01T00:00:00'
      - '2015-01-01T06:00:00'
      - '2015-01-01T12:00:00'
      - '2015-01-01T18:00:00'
      - '2015-01-02T00:00:00'
      - '2015-01-02T06:00:00'
      - '2015-01-02T12:00:00'
      - '2015-01-02T18:00:00'
      - '2015-01-03T00:00:00'
      - '2015-01-03T06:00:00'
      - '2015-01-03T12:00:00'
      - '2015-01-03T18:00:00'
      - '2015-01-04T00:00:00'
      - '2015-01-04T06:00:00'
      - '2015-01-04T12:00:00'
      - '2015-01-04T18:00:00'
    dataset:
      merge:
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/snow-capped-1000
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
    num_data_workers: 8
  aggregator:
    log_histograms: true
    time_mean_reference_data: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer/stats-1990-01-2019-12-condensate-floor-land/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 16
  # 16 workers x prefetch 2 (was 8 x 4: same 32 samples buffered per rank,
  # twice the reads in flight): loading is latency-bound on small
  # per-variable chunk reads (Ursa: 1.4-2.0 -> 0.71-0.78 s/batch).
  num_data_workers: 16
  prefetch_factor: 2
  dataset:
    merge:
    - concat:
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '1979-01-01T00:00:00'
          stop_time: '2014-12-31T06:00:00'
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '2016-01-01T00:00:00'
          stop_time: '2025-12-31T06:00:00'
    - concat:
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/snow-capped-1000
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '1979-01-01T00:00:00'
          stop_time: '2014-12-31T06:00:00'
      - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/snow-capped-1000
        file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
        subset:
          start_time: '2016-01-01T00:00:00'
          stop_time: '2025-12-31T06:00:00'
validation_loader:
  batch_size: 128
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    merge:
    - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_32layer
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      subset:
        start_time: '2015-01-01T00:00:00'
        stop_time: '2015-12-31T06:00:00'
        step: 3
    - data_path: /scratch4/BMC/gsienkf/whitaker/ace2_era5_1deg_16layer/snow-capped-1000
      file_pattern: '[12][0-9][0-9][0-9][01][0-9]0100.nc'
      subset:
        start_time: '2015-01-01T00:00:00'
        stop_time: '2015-12-31T06:00:00'
        step: 3
